<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Kahoot Clone - Nguoi choi</title>
  <!-- Nhúng đúng thư viện Socket.IO từ Server Render cấp phát -->
  <script src="/socket.io/socket.io.js"></script>
  <style>
    .btn { width: 45%; height: 100px; margin: 2%; font-size: 20px; color: white; border: none; cursor: pointer; border-radius: 8px; font-weight: bold; }
    .red { background-color: #e21b3c; }
    .blue { background-color: #1368ce; }
  </style>
</head>
<body>
  <div id="joinForm" style="margin-top: 50px; text-align: center;">
    <h2>KẾT NỐI TRÒ CHƠI</h2>
    <input type="text" id="pinInput" placeholder="Ma PIN phong choi" style="padding: 10px; font-size: 16px;"><br><br>
    <input type="text" id="nickInput" placeholder="Biet danh cua ban" style="padding: 10px; font-size: 16px;"><br><br>
    <button id="joinBtn" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">Tham Gia Game</button>
  </div>

  <div id="waiting" style="display:none; text-align: center; margin-top: 50px;">
    <h2>Ban da vao phong! Kiem tra man hinh lon.</h2>
  </div>

  <div id="controller" style="display:none; text-align: center; margin-top: 50px;">
    <h2>Chon khoi mau dung tren man hinh:</h2>
    <button class="btn red" onclick="sendAnswer(0)">Do (1)</button>
    <button class="btn blue" onclick="sendAnswer(1)">Xanh duong (2)</button>
  </div>

  <script>
    // Khởi tạo kết nối tự động nhận diện domain của Render
    const socket = io("wss://kahoot-clone-app.onrender.com", { transports: ["websocket"] });
    let myPin = '';

    document.getElementById('joinBtn').addEventListener('click', () => {
      myPin = document.getElementById('pinInput').value.trim();
      const nickname = document.getElementById('nickInput').value.trim();
      if(!myPin || !nickname) return alert("Vui long nhap du PIN va Biet danh");
      
      // Gửi tín hiệu tham gia lên máy chủ Render
      socket.emit('join-game', { pin: myPin, nickname });
    });

    socket.on('joined-successfully', () => {
      document.getElementById('joinForm').style.display = 'none';
      document.getElementById('waiting').style.display = 'block';
    });

    socket.on('show-controller', () => {
      document.getElementById('waiting').style.display = 'none';
      document.getElementById('controller').style.display = 'block';
    });

    function sendAnswer(answerIndex) {
      socket.emit('submit-answer', { pin: myPin, answerIndex: answerIndex });
      document.getElementById('controller').style.display = 'none';
      document.getElementById('waiting').innerText = "Da nop bai! Dang cho het gio...";
      document.getElementById('waiting').style.display = 'block';
    }

    socket.on('answer-result', (data) => {
      document.getElementById('waiting').innerText = data.correct 
        ? `Chinh xac! +${data.points} pts` 
        : "Sai roi!";
    });

    socket.on('question-ended', () => {
      document.getElementById('controller').style.display = 'none';
      if(document.getElementById('waiting').style.display === 'none' || document.getElementById('waiting').innerText.includes("Dang cho")) {
         document.getElementById('waiting').innerText = "Het gio lam bai!";
         document.getElementById('waiting').style.display = 'block';
      }
    });

    socket.on('join-error', (err) => alert(err));
  </script>
</body>
</html>
