<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Quiz Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEF0FB;
    --stripe: #E5E8FA;
    --card: #FFFFFF;
    --primary: #4B57E8;
    --primary-dark: #3944C9;
    --primary-disabled: #B7BDF2;
    --navy: #1B2350;
    --muted: #8D93B8;
    --border: #E7E9F6;
    --good: #2FB380;
    --bad: #E15B5B;

    --red: #E15B5B; --red-dark:#C43F3F;
    --blue: #4B57E8; --blue-dark:#3944C9;
    --yellow: #E8B23D; --yellow-dark:#C6941F;
    --green: #2FB380; --green-dark:#1F8F65;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; min-height:100%;
    background:
      repeating-linear-gradient(135deg, var(--stripe) 0 2px, transparent 2px 34px),
      var(--bg);
    font-family:'Inter', sans-serif; color:var(--navy);
  }
  .screen{
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:24px;
  }
  .hidden{ display:none !important; }

  .card{
    background:var(--card); border:1px solid var(--border); border-radius:22px;
    box-shadow: 0 10px 30px rgba(43,52,130,.06);
    padding: 34px 28px; width:100%; max-width: 380px; text-align:center;
  }

  .brand{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:22px;
    color:var(--primary); margin-bottom: 22px;
  }
  .pin-hint{
    font-size:14px; color:var(--muted); margin: -12px 0 18px 0;
  }
  .pin-hint b{ color:var(--primary); font-family:'Baloo 2', sans-serif; letter-spacing:2px; }

  label{ display:block; text-align:left; font-size:13px; font-weight:600; color:var(--muted); margin: 14px 0 6px 0; }
  input[type=text], input[type=tel]{
    width:100%; padding:14px 16px; font-size:18px; font-family:'Inter', sans-serif;
    border:1.5px solid var(--border); border-radius:12px; outline:none;
    background:#F8F9FE; color:var(--navy); font-weight:600;
    transition: border-color .15s;
  }
  input[type=tel]{ letter-spacing:6px; text-align:center; font-family:'Baloo 2', sans-serif; font-size:24px; }
  input:focus{ border-color: var(--primary); background:#fff; }

  .primary-btn{
    margin-top:22px; width:100%;
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:17px;
    background:var(--primary); color:#fff; border:none; border-radius:14px;
    padding:15px; cursor:pointer; box-shadow: 0 6px 0 var(--primary-dark);
    transition: transform .08s ease;
  }
  .primary-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--primary-dark); }
  .primary-btn:disabled{ background:var(--primary-disabled); box-shadow:none; cursor:not-allowed; }

  .error-msg{
    margin-top:14px; color:var(--bad); font-size:14px; font-weight:600; min-height:18px;
  }

  /* Waiting room */
  .avatar{
    width:76px; height:76px; border-radius:50%; background:var(--primary);
    color:#fff; font-family:'Baloo 2', sans-serif; font-weight:700; font-size:30px;
    display:flex; align-items:center; justify-content:center; margin:0 auto 18px auto;
  }
  .waiting-nick{ font-family:'Baloo 2', sans-serif; font-size:22px; font-weight:700; margin:0 0 6px 0; }
  .waiting-sub{ color:var(--muted); font-size:15px; margin:0; }
  .dots span{
    display:inline-block; width:8px; height:8px; margin:0 3px; border-radius:50%;
    background:var(--primary); animation: bounce 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2){ animation-delay:.15s; }
  .dots span:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{ 0%,80%,100%{ transform:scale(.6); opacity:.5; } 40%{ transform:scale(1); opacity:1; } }

  /* ---- Question screen ---- */
  .player-question-wrap{ width:100%; max-width:720px; }

  .question-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:22px;
  }
  .q-meta{ color:var(--muted); font-size:14px; font-weight:700; }
  .timer-pill{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:18px;
    background:var(--primary); color:#fff; min-width:58px;
    padding:8px 14px; border-radius:999px; text-align:center;
    box-shadow:0 5px 0 var(--primary-dark);
  }

  .player-question{
    font-family:'Baloo 2', sans-serif; font-size:32px; line-height:1.2; font-weight:800;
    text-align:center; color:var(--navy); margin:0 0 28px 0;
  }

  .options-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .opt-btn{
    min-height:110px; border:none; border-radius:18px; padding:20px; cursor:pointer;
    font-family:'Inter', sans-serif; color:#fff; font-weight:700; font-size:17px; line-height:1.3;
    box-shadow:0 6px 0 rgba(0,0,0,.15); transition:transform .08s ease, opacity .15s;
  }
  .opt-btn:active{ transform:translateY(4px); }
  .opt-btn.shape-0{ background:var(--red); box-shadow:0 6px 0 var(--red-dark); }
  .opt-btn.shape-1{ background:var(--blue); box-shadow:0 6px 0 var(--blue-dark); }
  .opt-btn.shape-2{ background:var(--yellow); box-shadow:0 6px 0 var(--yellow-dark); }
  .opt-btn.shape-3{ background:var(--green); box-shadow:0 6px 0 var(--green-dark); }
  .opt-btn:disabled{ opacity:.45; cursor:not-allowed; }
  .opt-shape{ display:block; font-size:24px; margin-bottom:8px; }

  @media(max-width:600px){
    .screen{ padding:16px; }
    .player-question{ font-size:25px; margin-bottom:20px; }
    .options-grid{ grid-template-columns:1fr 1fr; gap:10px; }
    .opt-btn{ min-height:125px; padding:14px 8px; font-size:15px; }
  }

  /* Result */
  .result-icon{ font-size:52px; margin-bottom:10px; }
  .result-title{ font-family:'Baloo 2', sans-serif; font-size:24px; font-weight:800; margin:0 0 6px 0; }
  .result-title.correct{ color:var(--good); }
  .result-title.wrong{ color:var(--bad); }
  .result-points{ color:var(--muted); font-size:15px; }

  .gameover-emoji{ font-size:48px; margin-bottom:10px; }

  /* ---- Final leaderboard ---- */
  .leaderboard-player{ width:100%; max-width:620px; margin:auto; text-align:center; }
  .leaderboard-title{
    font-family:'Baloo 2',sans-serif; font-size:32px; font-weight:800; color:var(--navy);
    display:flex; justify-content:center; align-items:center; gap:10px; margin-bottom:4px;
  }
  .leaderboard-subtitle{ color:var(--muted); font-size:14px; margin-bottom:30px; }

  .podium{
    display:flex; align-items:flex-end; justify-content:center;
    gap:10px; min-height:300px; margin-bottom:25px;
  }
  .podium-item{ width:30%; display:flex; flex-direction:column; align-items:center; }
  .podium-avatar{
    width:62px; height:62px; border-radius:50%; background:var(--primary); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2',sans-serif; font-size:27px; font-weight:800;
    border:4px solid #fff; box-shadow:0 5px 18px rgba(43,52,130,.18);
  }
  .podium-name{
    font-family:'Baloo 2',sans-serif; font-size:17px; font-weight:800; color:var(--navy);
    margin-top:8px; max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .podium-score{ font-size:15px; font-weight:800; color:var(--primary); margin:3px 0 8px; }
  .podium-block{
    width:100%; display:flex; justify-content:center; align-items:center;
    border-radius:12px 12px 0 0; font-family:'Baloo 2',sans-serif; font-weight:800;
    font-size:32px; color:#fff; background:var(--primary);
  }

  .podium-item.rank-1{ order:2; }
  .podium-item.rank-1 .podium-block{ height:145px; font-size:44px; }
  .podium-item.rank-1 .podium-avatar{ width:76px; height:76px; font-size:32px; }

  .podium-item.rank-2{ order:1; }
  .podium-item.rank-2 .podium-block{ height:105px; }

  .podium-item.rank-3{ order:3; }
  .podium-item.rank-3 .podium-block{ height:80px; }

  .ranking-list{ width:100%; }
  .ranking-row{
    display:flex; align-items:center; background:#fff; border:1px solid var(--border);
    border-radius:14px; padding:11px 15px; margin-bottom:8px; text-align:left;
  }
  .ranking-number{ width:35px; font-family:'Baloo 2',sans-serif; font-size:18px; font-weight:800; color:var(--muted); }
  .ranking-avatar{
    width:36px; height:36px; border-radius:50%; background:var(--primary); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800; margin-right:10px;
  }
  .ranking-name{ flex:1; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ranking-score{ font-family:'Baloo 2',sans-serif; font-weight:800; color:var(--navy); }

  @media(max-width:600px){
    .leaderboard-title{ font-size:26px; }
    .podium{ min-height:250px; gap:6px; }
    .podium-avatar{ width:52px; height:52px; }
    .podium-item.rank-1 .podium-avatar{ width:64px; height:64px; }
    .podium-name{ font-size:14px; max-width:100px; }
    .podium-score{ font-size:13px; }
    .podium-item.rank-1 .podium-block{ height:125px; }
    .podium-item.rank-2 .podium-block{ height:90px; }
    .podium-item.rank-3 .podium-block{ height:70px; }
  }
</style>
</head>
<body>

  <!-- JOIN VIEW -->
  <div class="screen" id="joinView">
    <div class="card">
      <div class="brand">🎉 Đố Vui</div>
      <p class="pin-hint hidden" id="pinHint">Phòng <b id="pinHintValue"></b></p>

      <div id="pinFieldWrap">
        <label for="pinInput">Mã PIN trò chơi</label>
        <input type="tel" id="pinInput" maxlength="6" inputmode="numeric" placeholder="------" />
      </div>

      <label for="nickInput">Tên hiển thị</label>
      <input type="text" id="nickInput" maxlength="20" placeholder="Nhập tên của bạn" />

      <label for="empIdInput">Mã số nhân viên (MSNV)</label>
      <input type="text" id="empIdInput" maxlength="20" placeholder="Nhập MSNV" />

      <button class="primary-btn" id="joinBtn" onclick="joinGame()">Tham gia</button>
      <p class="error-msg" id="joinError"></p>
    </div>
  </div>

  <!-- WAITING VIEW -->
  <div class="screen hidden" id="waitingView">
    <div class="card">
      <div class="avatar" id="waitAvatar">?</div>
      <p class="waiting-nick" id="waitNick"></p>
      <p class="waiting-sub">Đang chờ người chủ trò bắt đầu<br/>
        <span class="dots"><span></span><span></span><span></span></span>
      </p>
    </div>
  </div>

  <!-- QUESTION VIEW -->
  <div class="screen hidden" id="controllerView">
    <div class="player-question-wrap">
      <div class="question-header">
        <div class="q-meta" id="playerQMeta">Câu 1 / 2</div>
        <div class="timer-pill" id="timerPill">15s</div>
      </div>
      <h2 class="player-question" id="playerQuestion">...</h2>
      <div class="options-grid" id="optionsGrid"></div>
    </div>
  </div>

  <!-- RESULT VIEW -->
  <div class="screen hidden" id="resultView">
    <div class="card">
      <div class="result-icon" id="resultIcon">✅</div>
      <p class="result-title correct" id="resultTitle">Chính xác!</p>
      <p class="result-points" id="resultPoints">+1000 điểm</p>
    </div>
  </div>

  <!-- FINAL LEADERBOARD -->
  <div class="screen hidden" id="leaderboardView">
    <div class="leaderboard-player">
      <div class="leaderboard-title">🏆 <span>BẢNG XẾP HẠNG</span></div>
      <div class="leaderboard-subtitle" id="leaderboardSubtitle">Kết quả chung cuộc</div>
      <div class="podium" id="podium"></div>
      <div class="ranking-list" id="rankingList"></div>
    </div>
  </div>

  <!-- GAME OVER VIEW -->
  <div class="screen hidden" id="gameOverView">
    <div class="card">
      <div class="gameover-emoji">🏆</div>
      <p class="result-title" style="color:var(--navy);">Trò chơi kết thúc!</p>
      <p class="result-points">Cảm ơn bạn đã tham gia.</p>
    </div>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const el = id => document.getElementById(id);
  const shapeIcons = ['▲', '◆', '●', '■'];

  let myNickname = '';
  let myPin = '';
  let pinFromUrl = false;
  let hasJoined = false; // đã tham gia phòng thành công trong phiên này chưa

  // Định danh thiết bị cố định, không đổi kể cả khi mất kết nối / tải lại trang.
  // Dùng để server nhận ra "đây vẫn là người chơi cũ" khi tự động kết nối lại.
  function getDeviceId() {
    let id = localStorage.getItem('quizDeviceId');
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : `dev-${Date.now()}-${Math.random().toString(16).slice(2)}`);
      localStorage.setItem('quizDeviceId', id);
    }
    return id;
  }
  const deviceId = getDeviceId();

  function saveSession(pin) {
    localStorage.setItem('quizSession', JSON.stringify({ pin }));
  }
  function clearSession() {
    localStorage.removeItem('quizSession');
  }

  // Vào phòng trực tiếp qua QR/link (?pin=...) -> bỏ qua bước nhập PIN
  const urlParams = new URLSearchParams(window.location.search);
  const prefillPin = urlParams.get('pin');
  if (prefillPin && /^\d{6}$/.test(prefillPin)) {
    pinFromUrl = true;
    myPin = prefillPin;
    el('pinFieldWrap').classList.add('hidden');
    el('pinHint').classList.remove('hidden');
    el('pinHintValue').textContent = `#${prefillPin}`;
  }

  // Nếu trước đó đã từng tham gia phòng này (cùng deviceId, cùng PIN) -> thử tự động vào lại
  // trước khi bắt người chơi nhập tên/MSNV lại từ đầu.
  let attemptingAutoRejoin = false;
  try {
    const saved = JSON.parse(localStorage.getItem('quizSession') || 'null');
    if (saved?.pin && (!prefillPin || saved.pin === prefillPin)) {
      myPin = saved.pin;
      attemptingAutoRejoin = true;
      el('joinBtn').disabled = true;
      el('joinError').textContent = 'Đang kết nối lại vào phòng...';
    }
  } catch (e) { /* localStorage hỏng thì bỏ qua, vào form nhập bình thường */ }

  el('pinInput').addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
  });

  const SCREENS = ['joinView', 'waitingView', 'controllerView', 'resultView', 'leaderboardView', 'gameOverView'];
  function showScreen(id) {
    SCREENS.forEach(v => el(v).classList.toggle('hidden', v !== id));
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[m]));
  }

  // Mỗi khi socket kết nối (lần đầu HOẶC sau khi mất kết nối rồi tự nối lại),
  // nếu đã từng tham gia phòng thì tự động xin vào lại thay vì bắt nhập lại từ đầu.
  socket.on('connect', () => {
    if ((hasJoined || attemptingAutoRejoin) && myPin) {
      socket.emit('rejoin-game', { pin: myPin, deviceId });
    }
  });

  function joinGame() {
    const pin = pinFromUrl ? myPin : el('pinInput').value.trim();
    const nickname = el('nickInput').value.trim();
    const employeeId = el('empIdInput').value.trim();
    el('joinError').textContent = '';

    if (!pinFromUrl && pin.length !== 6) return el('joinError').textContent = 'Mã PIN phải có 6 chữ số.';
    if (!nickname) return el('joinError').textContent = 'Vui lòng nhập tên của bạn.';
    if (!employeeId) return el('joinError').textContent = 'Vui lòng nhập mã số nhân viên (MSNV).';

    el('joinBtn').disabled = true;
    myPin = pin;
    socket.emit('join-game', { pin, nickname, employeeId, deviceId });
  }

  socket.on('join-error', (msg) => {
    el('joinBtn').disabled = false;
    el('joinError').textContent = msg;
    attemptingAutoRejoin = false;
  });

  socket.on('joined-successfully', ({ nickname }) => {
    myNickname = nickname;
    hasJoined = true;
    attemptingAutoRejoin = false;
    saveSession(myPin);
    el('waitAvatar').textContent = nickname.charAt(0).toUpperCase();
    el('waitNick').textContent = nickname;
    showScreen('waitingView');
  });

  // Tự động vào lại phòng thành công sau khi mất kết nối tạm thời
  socket.on('rejoined-successfully', ({ nickname }) => {
    myNickname = nickname;
    hasJoined = true;
    attemptingAutoRejoin = false;
    saveSession(myPin);
    el('joinError').textContent = '';
    el('joinBtn').disabled = false;
    el('waitAvatar').textContent = nickname.charAt(0).toUpperCase();
    el('waitNick').textContent = nickname;
    // Mặc định về màn chờ; nếu đang giữa câu hỏi, server sẽ gửi tiếp 'show-controller' ngay sau đó.
    showScreen('waitingView');
  });

  // Không tìm lại được phiên cũ (phòng đã đóng, hoặc quá thời gian ân hạn) -> quay về nhập lại từ đầu
  socket.on('rejoin-failed', () => {
    attemptingAutoRejoin = false;
    hasJoined = false;
    clearSession();
    el('joinBtn').disabled = false;
    el('joinError').textContent = 'Phiên trước đã hết hạn, vui lòng tham gia lại.';
    showScreen('joinView');
  });

  // Trả lời đã được ghi nhận trước khi mất kết nối -> không cho bấm lại, chỉ báo đang chờ
  socket.on('already-answered', () => {
    document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
    el('resultIcon').textContent = '⏳';
    el('resultTitle').textContent = 'Đã gửi câu trả lời';
    el('resultTitle').className = 'result-title';
    el('resultPoints').textContent = 'Đang chờ kết thúc câu hỏi...';
    showScreen('resultView');
  });

  socket.on('show-controller', ({ questionText, options, questionNumber, totalQuestions }) => {
    el('playerQMeta').textContent = `Câu ${questionNumber} / ${totalQuestions}`;
    el('playerQuestion').textContent = questionText;

    const grid = el('optionsGrid');
    grid.innerHTML = '';
    options.forEach((option, i) => {
      const btn = document.createElement('button');
      btn.className = `opt-btn shape-${i % 4}`;
      btn.innerHTML = `<span class="opt-shape">${shapeIcons[i % 4]}</span>${escapeHtml(option)}`;
      btn.onclick = () => submitAnswer(i);
      grid.appendChild(btn);
    });

    showScreen('controllerView');
  });

  socket.on('timer-update', (t) => {
    el('timerPill').textContent = `${Math.max(t, 0)}s`;
  });

  function submitAnswer(index) {
    document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
    socket.emit('submit-answer', { pin: myPin, answerIndex: index });
  }

  socket.on('answer-result', ({ correct, points }) => {
    el('resultIcon').textContent = correct ? '✅' : '❌';
    const title = el('resultTitle');
    title.textContent = correct ? 'Chính xác!' : 'Chưa đúng rồi!';
    title.className = `result-title ${correct ? 'correct' : 'wrong'}`;
    el('resultPoints').textContent = correct ? `+${points} điểm` : 'Cố lên câu sau nhé!';
    showScreen('resultView');
  });

  socket.on('question-ended', () => {
    if (!el('resultView').classList.contains('hidden')) return;
    el('resultIcon').textContent = '⏰';
    el('resultTitle').textContent = 'Hết giờ!';
    el('resultTitle').className = 'result-title wrong';
    el('resultPoints').textContent = 'Bạn chưa kịp trả lời.';
    showScreen('resultView');
  });

  socket.on('show-leaderboard', ({ leaderboard, afterQuestionNumber, totalQuestions }) => {
    el('leaderboardSubtitle').textContent = `Kết quả chung cuộc • Sau câu ${afterQuestionNumber}/${totalQuestions}`;
    renderFinalLeaderboard(leaderboard);
    showScreen('leaderboardView');
  });

  function renderFinalLeaderboard(leaderboard) {
    const podium = el('podium');
    const rankingList = el('rankingList');
    podium.innerHTML = '';
    rankingList.innerHTML = '';

    if (!leaderboard || leaderboard.length === 0) {
      rankingList.innerHTML = '<p>Chưa có dữ liệu xếp hạng.</p>';
      return;
    }

    const top3 = leaderboard.slice(0, 3);
    const podiumOrder = [1, 0, 2]; // hiển thị 2 - 1 - 3, CSS order lo phần còn lại

    podiumOrder.forEach(index => {
      if (!top3[index]) return;
      const player = top3[index];
      const rank = index + 1;

      const item = document.createElement('div');
      item.className = `podium-item rank-${rank}`;
      item.innerHTML = `
        <div class="podium-avatar">${escapeHtml(player.nickname.charAt(0).toUpperCase())}</div>
        <div class="podium-name">${escapeHtml(player.nickname)}</div>
        <div class="podium-score">${player.score}</div>
        <div class="podium-block">${rank}</div>
      `;
      podium.appendChild(item);
    });

    leaderboard.slice(3).forEach((player, index) => {
      const rank = index + 4;
      const row = document.createElement('div');
      row.className = 'ranking-row';
      row.innerHTML = `
        <div class="ranking-number">${rank}</div>
        <div class="ranking-avatar">${escapeHtml(player.nickname.charAt(0).toUpperCase())}</div>
        <div class="ranking-name">${escapeHtml(player.nickname)}</div>
        <div class="ranking-score">${player.score}</div>
      `;
      rankingList.appendChild(row);
    });
  }

  socket.on('game-over', () => {
    clearSession();
    showScreen('gameOverView');
  });

  socket.on('host-disconnected', () => {
    clearSession();
    hasJoined = false;
    el('joinError').textContent = '';
    showScreen('joinView');
    el('joinBtn').disabled = false;
    alert('Người chủ trò đã rời phòng. Trò chơi đã kết thúc.');
  });

  // Enter key submits join form
  el('nickInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') joinGame(); });
  el('empIdInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') joinGame(); });
  el('pinInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') joinGame(); });
</script>
</body>
</html>
