<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hosting — Đố Vui</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEF0FB;
    --stripe: #E5E8FA;
    --card: #FFFFFF;
    --primary: #4B57E8;
    --primary-dark: #3944C9;
    --primary-disabled: #B7BDF2;
    --navy: #1B2350;
    --muted: #8D93B8;
    --border: #E7E9F6;
    --good: #2FB380;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:
      repeating-linear-gradient(135deg, var(--stripe) 0 2px, transparent 2px 34px),
      var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--navy);
  }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 22px 40px;
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(6px);
  }
  .topbar-left{ display:flex; align-items:center; gap:18px; }
  .close-btn{
    width:34px; height:34px; border-radius:50%;
    border:none; background:transparent; color:var(--muted);
    font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition: background .15s, color .15s;
  }
  .close-btn:hover{ background:#E9EBFB; color:var(--navy); }
  .hosting-label{
    font-size: 13px; color: var(--muted); font-weight:600; margin:0 0 2px 0;
  }
  .quiz-title{
    font-family:'Baloo 2', sans-serif;
    font-size: 24px; font-weight:700; margin:0; color:var(--navy);
  }
  .start-btn{
    font-family:'Baloo 2', sans-serif;
    background: var(--primary);
    color:#fff; border:none; border-radius: 14px;
    font-size:18px; font-weight:700;
    padding: 14px 30px; cursor:pointer;
    box-shadow: 0 6px 0 var(--primary-dark);
    transition: transform .08s ease;
  }
  .start-btn:active{ transform: translateY(4px); box-shadow: 0 2px 0 var(--primary-dark); }
  .start-btn:disabled{
    background: var(--primary-disabled); box-shadow:none; cursor:not-allowed;
  }

  .stage{ padding: 40px; }
  .panels{
    display:grid; grid-template-columns: 5fr 6fr; gap: 26px;
    max-width: 1300px; margin: 0 auto;
  }
  @media (max-width: 860px){
    .panels{ grid-template-columns: 1fr; }
  }

  .card{
    background: var(--card); border-radius: 22px;
    border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(43, 52, 130, 0.06);
    padding: 40px 32px;
  }

  .join-card{ text-align:center; }
  .join-instr{ font-size:15px; color: var(--muted); margin:0 0 18px 0; }
  .join-instr b{ color: var(--navy); font-weight:700; }

  .pin{
    font-family:'Baloo 2', sans-serif;
    font-size: 64px; font-weight:800; letter-spacing: 10px;
    color: var(--navy); cursor:pointer; user-select:none;
    margin: 6px 0 4px 0; line-height:1;
  }
  .pin:hover{ color: var(--primary); }
  .copy-hint{ font-size:13px; color: var(--muted); margin:0 0 26px 0; min-height:16px; }
  .copy-hint.copied{ color: var(--good); font-weight:600; }

  .qr-wrap img{ width: 220px; height:220px; border-radius: 12px; }
  .qr-fallback{
    width:220px; height:220px; margin:0 auto; border-radius:12px;
    background: var(--stripe); display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:13px;
  }
  .scan-hint{ font-size:14px; color: var(--muted); margin-top:22px; }

  .players-card h2{
    font-family:'Baloo 2', sans-serif;
    font-size:20px; margin:0 0 18px 0; font-weight:700;
  }
  .waiting{ color: var(--muted); font-size:15px; }

  .player-grid{
    display:flex; flex-wrap:wrap; gap:10px;
  }
  .player-chip{
    background: #F1F2FC; border: 1px solid var(--border);
    color: var(--navy); font-weight:600; font-size:14px;
    padding: 10px 16px; border-radius: 999px;
    animation: pop .25s ease;
  }
  @keyframes pop{ from{ transform: scale(.85); opacity:0; } to{ transform:scale(1); opacity:1; } }

  /* ---- In-question view ---- */
  .hidden{ display:none !important; }
  .question-stage{ max-width: 1100px; margin: 0 auto; }

  .q-topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 22px;
  }
  .skip-btn{
    font-family:'Inter', sans-serif; font-weight:600; font-size:14px;
    background: transparent; border:1.5px solid var(--border); color:var(--muted);
    border-radius: 999px; padding: 9px 18px; cursor:pointer;
    transition: border-color .15s, color .15s;
  }
  .skip-btn:hover{ border-color: var(--primary); color: var(--primary); }
  .answered-count{
    font-size:13px; font-weight:700; color:var(--muted);
    background:#fff; border:1px solid var(--border); border-radius:999px;
    padding:9px 16px;
  }
  .answered-count b{ color:var(--navy); }

  .q-center{ text-align:center; }
  .q-meta{ color:var(--muted); font-weight:600; font-size:14px; margin-bottom:10px; }
  .q-text{
    font-family:'Baloo 2', sans-serif; font-size: 32px; font-weight:700;
    margin: 0 0 22px 0; color: var(--navy);
  }
  .timer{
    font-family:'Baloo 2', sans-serif; font-size:24px; font-weight:800;
    width:64px; height:64px; border-radius:50%; background:var(--primary); color:#fff;
    display:flex; align-items:center; justify-content:center; margin: 0 auto 28px auto;
    box-shadow: 0 6px 0 var(--primary-dark);
  }
  .options-grid{
    display:grid; grid-template-columns: 1fr 1fr; gap:16px;
  }
  .option-card{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding: 22px; font-size:18px; font-weight:600; text-align:left;
    display:flex; align-items:center; gap:12px;
  }
  .opt-dot{
    width:14px; height:14px; border-radius:4px; flex-shrink:0;
  }
  .opt-dot.c0{ background:var(--red, #E15B5B); }
  .opt-dot.c1{ background:var(--primary); }
  .opt-dot.c2{ background:#E8B23D; }
  .opt-dot.c3{ background:#2FB380; }

  /* ---- Reveal view ---- */
  .reveal-stage{ max-width: 720px; margin: 0 auto; }
  .reveal-q{
    font-family:'Baloo 2', sans-serif; font-size:24px; font-weight:700;
    text-align:center; margin: 0 0 26px 0;
  }
  .reveal-bar-row{ margin-bottom: 14px; }
  .reveal-bar-label{
    display:flex; align-items:center; justify-content:space-between;
    font-size:14px; font-weight:600; color:var(--navy); margin-bottom:6px;
  }
  .reveal-bar-label .correct-tag{
    color: var(--good); font-weight:800; display:flex; align-items:center; gap:4px;
  }
  .reveal-track{
    background:#F1F2FC; border-radius:10px; height: 34px; overflow:hidden;
    border:1px solid var(--border);
  }
  .reveal-fill{
    height:100%; background: var(--border); border-radius:10px 0 0 10px;
    display:flex; align-items:center; justify-content:flex-end; padding-right:10px;
    color:#fff; font-weight:700; font-size:13px; transition: width .5s ease;
    min-width: 34px;
  }
  .reveal-fill.correct{ background: var(--good); }
  .lb-continue-btn{
    display:block; margin: 28px auto 0 auto;
    font-family:'Baloo 2', sans-serif; background:var(--primary); color:#fff;
    border:none; border-radius:14px; font-size:16px; font-weight:700;
    padding:14px 30px; cursor:pointer; box-shadow: 0 6px 0 var(--primary-dark);
  }

  /* ---- Leaderboard (podium, giống player) ---- */
  .leaderboard-stage{ max-width: 720px; margin: 0 auto; text-align:center; }
  .lb-tag{
    display:inline-block; font-size:13px; font-weight:600; color:var(--muted);
    background:#fff; border:1px solid var(--border); border-radius:999px; padding:7px 14px;
    margin-bottom: 8px;
  }
  .leaderboard-title{
    font-family:'Baloo 2',sans-serif; font-size:32px; font-weight:800; color:var(--navy);
    display:flex; justify-content:center; align-items:center; gap:10px; margin: 0 0 4px 0;
  }

  .podium{
    display:flex; align-items:flex-end; justify-content:center;
    gap:14px; min-height:300px; margin: 24px 0;
  }
  .podium-item{ width:26%; max-width:180px; display:flex; flex-direction:column; align-items:center; }
  .podium-avatar{
    width:62px; height:62px; border-radius:50%; background:var(--primary); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2',sans-serif; font-size:27px; font-weight:800;
    border:4px solid #fff; box-shadow:0 5px 18px rgba(43,52,130,.18);
  }
  .podium-name{
    font-family:'Baloo 2',sans-serif; font-size:17px; font-weight:800; color:var(--navy);
    margin-top:8px; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .podium-score{ font-size:15px; font-weight:800; color:var(--primary); margin:3px 0 8px; }
  .podium-block{
    width:100%; display:flex; justify-content:center; align-items:center;
    border-radius:12px 12px 0 0; font-family:'Baloo 2',sans-serif; font-weight:800;
    font-size:32px; color:#fff; background:var(--primary);
  }
  .podium-item.rank-1{ order:2; }
  .podium-item.rank-1 .podium-block{ height:170px; font-size:48px; }
  .podium-item.rank-1 .podium-avatar{ width:80px; height:80px; font-size:34px; }
  .podium-item.rank-2{ order:1; }
  .podium-item.rank-2 .podium-block{ height:125px; }
  .podium-item.rank-3{ order:3; }
  .podium-item.rank-3 .podium-block{ height:95px; }

  .ranking-list{ width:100%; max-width:520px; margin: 0 auto; text-align:left; }
  .ranking-row{
    display:flex; align-items:center; background:#fff; border:1px solid var(--border);
    border-radius:14px; padding:11px 15px; margin-bottom:8px;
  }
  .ranking-number{ width:35px; font-family:'Baloo 2',sans-serif; font-size:18px; font-weight:800; color:var(--muted); }
  .ranking-avatar{
    width:36px; height:36px; border-radius:50%; background:var(--primary); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800; margin-right:10px;
    font-family:'Baloo 2', sans-serif; flex-shrink:0;
  }
  .ranking-name{ flex:1; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ranking-score{ font-family:'Baloo 2',sans-serif; font-weight:800; color:var(--navy); }

  .next-btn{
    display:block; margin: 26px auto 0 auto;
    font-family:'Baloo 2', sans-serif; background:var(--primary); color:#fff;
    border:none; border-radius:14px; font-size:16px; font-weight:700;
    padding:14px 28px; cursor:pointer; box-shadow: 0 6px 0 var(--primary-dark);
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-left">
      <button class="close-btn" onclick="confirmClose()">✕</button>
      <div>
        <p class="hosting-label">Hosting</p>
        <h1 class="quiz-title" id="quizTitle">Untitled Quiz</h1>
      </div>
    </div>
    <button class="start-btn" id="startBtn" disabled onclick="startQuestion()">Start (0)</button>
  </div>

  <div class="stage">

    <!-- LOBBY VIEW -->
    <div class="panels" id="lobbyView">
      <div class="card join-card">
        <p class="join-instr">Go to <b id="joinDomain">...</b> and enter</p>
        <div class="pin" id="pin" onclick="copyJoinLink()">------</div>
        <p class="copy-hint" id="copyHint">Click the code to copy the join link</p>
        <div class="qr-wrap" id="qrWrap">
          <div class="qr-fallback">Đang tạo mã QR…</div>
        </div>
        <p class="scan-hint">...or scan to join.</p>
      </div>

      <div class="card players-card">
        <h2 id="playersHeading">Players (0)</h2>
        <p class="waiting" id="waitingText">Waiting for players...</p>
        <div class="player-grid" id="playerGrid"></div>
      </div>
    </div>

    <!-- QUESTION VIEW -->
    <div class="question-stage hidden" id="questionView">
      <div class="q-topbar">
        <button class="skip-btn" onclick="skipQuestion()">Bỏ qua →</button>
        <div class="answered-count" id="answeredCount"><b>0</b> / 0 đã trả lời</div>
      </div>
      <div class="q-center">
        <div class="timer" id="timerDisplay">15</div>
        <p class="q-meta" id="qMeta">Câu 1 / 2</p>
        <h2 class="q-text" id="qText">...</h2>
      </div>
      <div class="options-grid" id="optionsGrid"></div>
    </div>

    <!-- REVEAL VIEW -->
    <div class="reveal-stage hidden" id="revealView">
      <p class="reveal-q" id="revealQText">...</p>
      <div id="revealBars"></div>
      <button class="lb-continue-btn" id="revealContinueBtn">Câu tiếp theo →</button>
    </div>

    <!-- LEADERBOARD VIEW (podium, giống player) -->
    <div class="leaderboard-stage hidden" id="leaderboardView">
      <span class="lb-tag" id="lbTag">Sau câu 1/2</span>
      <div class="leaderboard-title">🏆 <span>BẢNG XẾP HẠNG</span></div>
      <div class="podium" id="podium"></div>
      <div class="ranking-list" id="rankingList"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Câu tiếp theo →</button>
    </div>

  </div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  let currentPin = null;

  const el = id => document.getElementById(id);
  const SCREENS = ['lobbyView', 'questionView', 'revealView', 'leaderboardView'];
  const showHostScreen = (id) => SCREENS.forEach(v => el(v).classList.toggle('hidden', v !== id));

  socket.on('connect', () => {
    socket.emit('create-game');
  });

  socket.on('game-created', ({ pin, quizTitle, joinUrl, qrCodeDataUrl }) => {
    currentPin = pin;
    el('quizTitle').textContent = quizTitle || 'Untitled Quiz';
    el('pin').textContent = pin;

    try {
      const domain = new URL(joinUrl).host + '/play';
      el('joinDomain').textContent = domain;
    } catch (e) {
      el('joinDomain').textContent = joinUrl;
    }

    if (qrCodeDataUrl) {
      el('qrWrap').innerHTML = `<img src="${qrCodeDataUrl}" alt="QR code tham gia" />`;
    }

    el('pin').dataset.joinUrl = joinUrl;
  });

  socket.on('player-list-update', ({ count, players }) => {
    el('playersHeading').textContent = `Players (${count})`;
    el('startBtn').textContent = `Start (${count})`;
    el('startBtn').disabled = count === 0;

    el('waitingText').classList.toggle('hidden', count > 0);
    el('playerGrid').innerHTML = players
      .map(name => `<div class="player-chip">${escapeHtml(name)}</div>`)
      .join('');
  });

  socket.on('render-question-host', ({ questionText, options, questionNumber, totalQuestions, totalPlayers }) => {
    showHostScreen('questionView');

    el('qMeta').textContent = `Câu ${questionNumber} / ${totalQuestions}`;
    el('qText').textContent = questionText;
    el('optionsGrid').innerHTML = options
      .map((opt, i) => `<div class="option-card"><span class="opt-dot c${i % 4}"></span>${escapeHtml(opt)}</div>`)
      .join('');
    el('answeredCount').innerHTML = `<b>0</b> / ${totalPlayers} đã trả lời`;
    el('startBtn').disabled = true;
  });

  socket.on('timer-update', (t) => {
    el('timerDisplay').textContent = Math.max(t, 0);
  });

  socket.on('answer-count-update', ({ answered, total }) => {
    el('answeredCount').innerHTML = `<b>${answered}</b> / ${total} đã trả lời`;
  });

  socket.on('show-reveal', ({ questionText, options, correctIndex, isLast }) => {
    showHostScreen('revealView');

    el('revealQText').textContent = questionText;
    const maxCount = Math.max(1, ...options.map(o => o.count));

    el('revealBars').innerHTML = options.map((o, i) => {
      const isCorrect = i === correctIndex;
      const widthPct = Math.max(8, Math.round((o.count / maxCount) * 100));
      return `
        <div class="reveal-bar-row">
          <div class="reveal-bar-label">
            <span>${escapeHtml(o.text)}</span>
            ${isCorrect ? '<span class="correct-tag">✓ Đáp án đúng</span>' : ''}
          </div>
          <div class="reveal-track">
            <div class="reveal-fill ${isCorrect ? 'correct' : ''}" style="width:${widthPct}%">${o.count}</div>
          </div>
        </div>`;
    }).join('');

    // Câu cuối -> xem bảng xếp hạng. Câu giữa -> đi thẳng sang câu tiếp theo.
    const continueBtn = el('revealContinueBtn');
    if (isLast) {
      continueBtn.textContent = 'Xem bảng xếp hạng →';
      continueBtn.onclick = requestLeaderboard;
    } else {
      continueBtn.textContent = 'Câu tiếp theo →';
      continueBtn.onclick = nextQuestion;
    }
  });

  socket.on('show-leaderboard', ({ leaderboard, afterQuestionNumber, totalQuestions, isLast }) => {
    showHostScreen('leaderboardView');

    el('lbTag').textContent = `Sau câu ${afterQuestionNumber} / ${totalQuestions}`;
    el('nextBtn').textContent = isLast ? 'Kết thúc trò chơi 🏁' : 'Câu tiếp theo →';

    renderPodiumLeaderboard(leaderboard);
  });

  function renderPodiumLeaderboard(leaderboard) {
    const podium = el('podium');
    const rankingList = el('rankingList');
    podium.innerHTML = '';
    rankingList.innerHTML = '';

    if (!leaderboard || leaderboard.length === 0) {
      rankingList.innerHTML = '<p class="waiting">Chưa có ai ghi điểm.</p>';
      return;
    }

    const top3 = leaderboard.slice(0, 3);
    const podiumOrder = [1, 0, 2]; // hiển thị 2 - 1 - 3, CSS order lo phần còn lại

    podiumOrder.forEach(index => {
      if (!top3[index]) return;
      const player = top3[index];
      const rank = index + 1;

      const item = document.createElement('div');
      item.className = `podium-item rank-${rank}`;
      item.innerHTML = `
        <div class="podium-avatar">${escapeHtml(player.nickname.charAt(0).toUpperCase())}</div>
        <div class="podium-name">${escapeHtml(player.nickname)}</div>
        <div class="podium-score">${player.score}</div>
        <div class="podium-block">${rank}</div>
      `;
      podium.appendChild(item);
    });

    leaderboard.slice(3).forEach((player, index) => {
      const rank = index + 4;
      const row = document.createElement('div');
      row.className = 'ranking-row';
      row.innerHTML = `
        <div class="ranking-number">${rank}</div>
        <div class="ranking-avatar">${escapeHtml(player.nickname.charAt(0).toUpperCase())}</div>
        <div class="ranking-name">${escapeHtml(player.nickname)}</div>
        <div class="ranking-score">${player.score}</div>
      `;
      rankingList.appendChild(row);
    });
  }

  socket.on('game-over', () => {
    showHostScreen('lobbyView');
    el('lobbyView').innerHTML = `<div class="card" style="grid-column:1/-1; text-align:center;">
      <h2 style="font-family:'Baloo 2',sans-serif;">🎉 Trò chơi kết thúc!</h2>
      <p class="waiting">Cảm ơn mọi người đã tham gia.</p>
    </div>`;
  });

  function startQuestion() {
    if (!currentPin) return;
    el('startBtn').disabled = true;
    socket.emit('start-question', { pin: currentPin });
  }

  function skipQuestion() {
    if (!currentPin) return;
    socket.emit('skip-question', { pin: currentPin });
  }

  function requestLeaderboard() {
    if (!currentPin) return;
    socket.emit('request-leaderboard', { pin: currentPin });
  }

  function nextQuestion() {
    if (!currentPin) return;
    socket.emit('next-question', { pin: currentPin });
  }

  function copyJoinLink() {
    const url = el('pin').dataset.joinUrl;
    if (!url) return;
    navigator.clipboard.writeText(url).then(() => {
      const hint = el('copyHint');
      hint.textContent = 'Đã sao chép liên kết!';
      hint.classList.add('copied');
      setTimeout(() => {
        hint.textContent = 'Click the code to copy the join link';
        hint.classList.remove('copied');
      }, 1800);
    });
  }

  function confirmClose() {
    if (confirm('Thoát khỏi phòng chơi? Trò chơi sẽ kết thúc cho tất cả người chơi.')) {
      window.location.href = '/';
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[m]));
  }
</script>
</body>
</html>
